# Initial conservative settings; calibrate against T800's actual motion.
pose_topic: /my_ros1/localization/base_footprint_pose
cmd_topic: /my_ros1/motion/body_vel_cmd
autostart: false
control_rate: 30.0
pose_timeout: 0.5
xy_tolerance: 0.05
yaw_tolerance_deg: 5.0
realign_threshold_deg: 12.0
kp_forward: 0.8
kp_turn: 0.8
kp_steer: 0.0
max_forward_speed: 0.7
min_forward_speed: 0.3
max_turn_speed: 2.0
min_turn_speed: 0.5
max_steering_speed: 0.8

# 增加障碍状态输入和看门狗。
obstacle_enabled: true
obstacle_topic: /my_ros1/navigation/obstacle_status
obstacle_timeout: 0.35
safety_poll_rate: 20.0

# 新增：定位状态门控，必须在实机上开启。
localization_enabled: true
gicp_status_topic: /my_ros1/localization/status
pose_status_topic: /my_ros1/localization/pose_status
gicp_status_timeout: 3.0
pose_status_timeout: 2.0
# 允许上游时间戳最多领先当前 ROS 时间 100ms，设备时间必须同步。
pose_future_tolerance: 0.1
# 实际频率等于 control_rate（30Hz）；不锁存；由 control_step 发布。
heartbeat_topic: /my_ros1/navigation/controller_heartbeat
